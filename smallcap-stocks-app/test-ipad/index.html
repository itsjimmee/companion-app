<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SmallCap Scanner — iPad Test</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --surface: #141b2d;
      --text: #f0f4ff;
      --muted: #8b95a8;
      --ok: #22c55e;
      --fail: #ef4444;
      --accent: #00d4aa;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    }
    h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 17px; margin-bottom: 24px; line-height: 1.4; }
    .card {
      background: var(--surface);
      border: 1px solid #243049;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      min-height: 56px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .primary { background: var(--accent); color: #0b0f1a; }
    .secondary { background: #243049; color: var(--text); }
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.fail { background: var(--fail); }
    .dot.run { background: var(--warn); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    pre {
      background: #0a0e18;
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.5;
      color: #c8d0e0;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 12px 0 0;
    }
    .samples { display: grid; gap: 10px; margin-top: 12px; }
    .ticker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0e18;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 17px;
    }
    .sym { font-weight: 800; letter-spacing: 0.5px; }
    .gap { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
    .link {
      display: block;
      text-align: center;
      color: var(--accent);
      font-size: 16px;
      margin-top: 8px;
      word-break: break-all;
    }
    footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>SmallCap Scanner</h1>
  <p class="sub">iPad connectivity test — Polygon API, market scanner, and sample gap tickers.</p>

  <div class="card">
    <button class="primary" id="runBtn">Run All Tests</button>
    <button class="secondary" id="refreshBtn">Refresh Results</button>
  </div>

  <div class="card" id="polygonCard">
    <div class="status"><span class="dot" id="polyDot"></span><span id="polyLabel">Polygon API</span></div>
    <pre id="polyOut">Tap “Run All Tests” to start.</pre>
  </div>

  <div class="card" id="scannerCard">
    <div class="status"><span class="dot" id="scanDot"></span><span id="scanLabel">Market Scanner</span></div>
    <pre id="scanOut">Waiting…</pre>
    <div class="samples" id="samples"></div>
  </div>

  <div class="card" id="expoCard">
    <div class="status"><span class="dot ok"></span><span>Full app (Expo Go)</span></div>
    <p style="color:var(--muted);margin:8px 0 0;font-size:15px;">Install Expo Go on iPad, then open:</p>
    <a class="link" id="expoLink" href="#">Loading Expo URL…</a>
  </div>

  <footer id="footer">Server time: —</footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const setDot = (id, state) => { $(id).className = 'dot ' + (state || ''); };

    async function runTests() {
      $('runBtn').disabled = true;
      setDot('polyDot', 'run');
      setDot('scanDot', 'run');
      $('polyOut').textContent = 'Checking Polygon key…';
      $('scanOut').textContent = 'Fetching grouped daily bars…';
      $('samples').innerHTML = '';

      try {
        const res = await fetch('/api/run-all');
        const data = await res.json();
        $('footer').textContent = 'Server time: ' + (data.serverTime || '—');

        if (data.polygon?.ok) {
          setDot('polyDot', 'ok');
          $('polyOut').textContent = data.polygon.message + '\nAAPL prev close: $' + (data.polygon.aaplClose ?? '—');
        } else {
          setDot('polyDot', 'fail');
          $('polyOut').textContent = data.polygon?.error || 'Polygon test failed';
        }

        if (data.scanner?.ok) {
          setDot('scanDot', 'ok');
          $('scanOut').textContent =
            'Date: ' + data.scanner.date + '\n' +
            'Tickers: ' + data.scanner.tickerCount + '\n' +
            'Gaps ≥5%: ' + data.scanner.gapCount + '\n' +
            'Intraday runs ≥5%: ' + data.scanner.runCount;
          (data.scanner.topGaps || []).forEach((t) => {
            const el = document.createElement('div');
            el.className = 'ticker';
            el.innerHTML = '<span class="sym">' + t.symbol + '</span><span class="gap">+' + t.gapPercent.toFixed(1) + '%</span>';
            $('samples').appendChild(el);
          });
        } else {
          setDot('scanDot', 'fail');
          $('scanOut').textContent = data.scanner?.error || 'Scanner test failed';
        }
      } catch (e) {
        setDot('polyDot', 'fail');
        setDot('scanDot', 'fail');
        $('polyOut').textContent = String(e.message || e);
      } finally {
        $('runBtn').disabled = false;
      }
    }

    async function loadMeta() {
      try {
        const res = await fetch('/api/meta');
        const data = await res.json();
        if (data.expoUrl) {
          $('expoLink').href = data.expoUrl;
          $('expoLink').textContent = data.expoUrl;
        } else {
          $('expoLink').textContent = 'Expo tunnel not running — ask agent to start expo start --tunnel';
        }
      } catch (_) {}
    }

    $('runBtn').addEventListener('click', runTests);
    $('refreshBtn').addEventListener('click', runTests);
    loadMeta();
  </script>
</body>
</html>
